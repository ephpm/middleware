name: release

# Builds the loadable middleware cdylibs for the platform matrix ePHPm ships
# and publishes them as release assets under the platform-suffixed names the
# host loader (`resolve_library` in ephpm-server/src/middleware.rs) expects.
#
# Runners are all GitHub-HOSTED on purpose: these modules are pure Rust (no PHP
# SDK), so they don't need — and must not contend with — the self-hosted
# ephemerd fleet that builds ePHPm itself and the php-sdk tarballs.
#
# Two triggers:
#   * push of a `v*` tag  → full matrix, all four modules, a real release.
#   * workflow_dispatch   → scriptable proof/partial cut. `modules` and
#     `only_host_platform` subset the work so a single module on one platform
#     can validate the whole pipeline without grinding every leg.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0-rc.1)"
        required: true
        type: string
      modules:
        description: 'Comma list of module short names, or "all"'
        required: false
        default: "all"
        type: string
      only_host_platform:
        description: "Build only linux-x86_64-gnu (fast proof)"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        default: true
        type: boolean

# One source of truth for the ABI major this repo targets and the module list.
# ABI_MAJOR must equal `ephpm_middleware::abi::ABI_V1 >> 24` at the pinned rev.
env:
  ABI_MAJOR: "1"
  CARGO_TERM_COLOR: always
  # The ephpm-middleware ABI crate is a git dependency; fetch via the git CLI so
  # any host git rewrite rules apply and private-transport edge cases are the
  # CLI's problem, not libgit2's.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: write

jobs:
  # ── Compute the (possibly subset) platform matrix, module list and tag ──────
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      modules: ${{ steps.plan.outputs.modules }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_TAG: ${{ inputs.tag }}
          IN_MODULES: ${{ inputs.modules }}
          ONLY_HOST: ${{ inputs.only_host_platform }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Master platform matrix — mirrors what ePHPm ships. `suffix` is the
          # asset-name libc marker; `prefix` is the cdylib file prefix cargo
          # emits on that OS.
          full='[
            {"runner":"ubuntu-latest",   "target":"x86_64-unknown-linux-gnu",   "platform":"linux-x86_64",  "libc":"gnu",  "suffix":"",      "prefix":"lib", "ext":"so"},
            {"runner":"ubuntu-latest",   "target":"x86_64-unknown-linux-musl",  "platform":"linux-x86_64",  "libc":"musl", "suffix":"-musl", "prefix":"lib", "ext":"so"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu",  "platform":"linux-aarch64", "libc":"gnu",  "suffix":"",      "prefix":"lib", "ext":"so"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl", "platform":"linux-aarch64", "libc":"musl", "suffix":"-musl", "prefix":"lib", "ext":"so"},
            {"runner":"macos-14",        "target":"aarch64-apple-darwin",       "platform":"darwin-aarch64","libc":"",     "suffix":"",      "prefix":"lib", "ext":"dylib"},
            {"runner":"windows-latest",  "target":"x86_64-pc-windows-msvc",     "platform":"windows-x86_64","libc":"",     "suffix":"",      "prefix":"",    "ext":"dll"}
          ]'

          # Master module list — short name ↔ crate. Single source of truth for
          # asset naming; the CLI mirrors these short names.
          all_modules='[
            {"short":"api-key",          "crate":"ephpm-middleware-api-key"},
            {"short":"jwt",              "crate":"ephpm-middleware-jwt"},
            {"short":"cors",             "crate":"ephpm-middleware-cors"},
            {"short":"ratelimit",        "crate":"ephpm-middleware-ratelimit"},
            {"short":"security-headers", "crate":"ephpm-middleware-security-headers"}
          ]'

          if [ "$ONLY_HOST" = "true" ]; then
            matrix="$(printf '%s' "$full" | jq -c '[.[] | select(.target=="x86_64-unknown-linux-gnu")]')"
          else
            matrix="$(printf '%s' "$full" | jq -c '.')"
          fi

          if [ "$EVENT" = "workflow_dispatch" ] && [ "${IN_MODULES:-all}" != "all" ]; then
            wanted="$(printf '%s' "$IN_MODULES" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";""))')"
            modules="$(printf '%s' "$all_modules" | jq -c --argjson w "$wanted" '[.[] | select(.short as $s | $w | index($s))]')"
          else
            modules="$(printf '%s' "$all_modules" | jq -c '.')"
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$IN_TAG"
          else
            tag="$REF_NAME"
          fi

          {
            echo "matrix=$matrix"
            echo "modules=$modules"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Planned tag=$tag"
          echo "Modules: $modules"
          echo "Matrix: $matrix"

  # ── Build every requested module for one platform, upload the assets ────────
  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        plat: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.plat.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.plat.target }}
          rustup default stable

      - name: Install musl toolchain
        if: matrix.plat.libc == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build modules
        shell: bash
        env:
          MODULES: ${{ needs.setup.outputs.modules }}
          TARGET: ${{ matrix.plat.target }}
          PLATFORM: ${{ matrix.plat.platform }}
          SUFFIX: ${{ matrix.plat.suffix }}
          PREFIX: ${{ matrix.plat.prefix }}
          EXT: ${{ matrix.plat.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "$MODULES" | jq -c '.[]' | while read -r m; do
            short="$(echo "$m" | jq -r '.short')"
            crate="$(echo "$m" | jq -r '.crate')"
            libname="$(echo "$crate" | tr '-' '_')"   # cargo cdylib lib name
            cargo build --release -p "$crate" --target "$TARGET"
            src="target/${TARGET}/release/${PREFIX}${libname}.${EXT}"
            asset="${short}.${PLATFORM}${SUFFIX}.${EXT}"
            cp "$src" "dist/${asset}"
            echo "built ${asset}"
          done
          ls -l dist

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ matrix.plat.platform }}-${{ matrix.plat.libc }}
          path: dist/*
          if-no-files-found: error

  # ── Gather everything, write SHA256SUMS + manifest.json, publish ────────────
  release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all module artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: modules-*
          path: staging
          merge-multiple: true

      - name: Checksums + manifest
        shell: bash
        env:
          TAG: ${{ needs.setup.outputs.tag }}
          MODULES: ${{ needs.setup.outputs.modules }}
        run: |
          set -euo pipefail
          cd staging
          # Deterministic ordering so the SHA256SUMS diff is reviewable.
          sha256sum $(ls | sort) > SHA256SUMS
          cat SHA256SUMS

          # manifest.json: the CLI reads abi_major (download-time compat gate)
          # and the module/asset list (list + platform→asset mapping).
          python3 - "$TAG" <<'PY'
          import json, os, sys, hashlib, re
          tag = sys.argv[1]
          modules = json.loads(os.environ["MODULES"])
          shorts = {m["short"]: m["crate"] for m in modules}
          entries = {s: {"name": s, "crate": c, "describe": c, "assets": []}
                     for s, c in shorts.items()}
          pat = re.compile(r"^(?P<short>.+?)\.(?P<platform>(linux|darwin|windows)-[a-z0-9_]+?)(?P<musl>-musl)?\.(?P<ext>so|dylib|dll)$")
          for fn in sorted(os.listdir(".")):
              if fn in ("SHA256SUMS", "manifest.json"):
                  continue
              m = pat.match(fn)
              if not m:
                  raise SystemExit(f"unexpected asset name: {fn}")
              short = m["short"]
              if short not in entries:
                  raise SystemExit(f"asset {fn} has no module entry for {short}")
              with open(fn, "rb") as fh:
                  digest = hashlib.sha256(fh.read()).hexdigest()
              entries[short]["assets"].append({
                  "platform": m["platform"],
                  "libc": "musl" if m["musl"] else ("gnu" if m["platform"].startswith("linux") else ""),
                  "file": fn,
                  "ext": m["ext"],
                  "sha256": digest,
              })
          manifest = {
              "schema": 1,
              "abi_major": int(os.environ.get("ABI_MAJOR", "1")),
              "release": tag,
              "modules": [entries[s] for s in sorted(entries) if entries[s]["assets"]],
          }
          with open("manifest.json", "w") as fh:
              json.dump(manifest, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(open("manifest.json").read())
          PY

      - name: Create / update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd staging
          flags=()
          if [ "${PRERELEASE:-false}" = "true" ]; then flags+=(--prerelease); fi
          # Recreate the release idempotently so a re-dispatch replaces assets.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --notes "ePHPm native middleware modules (ABI major ${ABI_MAJOR}). Assets are platform-suffixed cdylibs; verify against SHA256SUMS. See manifest.json for the module/ABI listing." \
            "${flags[@]}" \
            *
