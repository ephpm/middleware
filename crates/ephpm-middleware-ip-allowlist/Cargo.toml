[package]
name = "ephpm-middleware-ip-allowlist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ePHPm native middleware: per-site IP allow/deny by CIDR (loadable cdylib; implementation in ephpm-middleware-modules)"

[lib]
# cdylib = the loadable module for the dlopen lane; rlib for tests + the
# `vendor-middleware` feature. See ephpm-middleware-jwt for the symbol-collision
# rationale behind the impl/shell split.
crate-type = ["cdylib", "rlib"]

[dependencies]
ephpm-middleware.workspace = true
ephpm-middleware-modules.workspace = true

[dev-dependencies]
# The deny-path integration test drives the loaded `IpAllowlist` through the
# shell crate's re-export and the `host` feature's `RequestCtx`/`host_table`,
# asserting a real 403 RESPOND verdict. No KV store is wired in — this gate is
# pure CIDR policy, so the test is deterministic and never flaky.
ephpm-middleware = { workspace = true, features = ["host"] }
serde_json.workspace = true

[lints]
workspace = true
