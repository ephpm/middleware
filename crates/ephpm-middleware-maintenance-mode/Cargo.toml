[package]
name = "ephpm-middleware-maintenance-mode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ePHPm native middleware: flip a tenant into a 503 holding page via a per-site KV flag, no redeploy (loadable cdylib; implementation in ephpm-middleware-modules)"

[lib]
# cdylib = the loadable module for the dlopen lane; rlib for tests + the
# `vendor-middleware` feature. See ephpm-middleware-jwt for the symbol-collision
# rationale behind the impl/shell split.
crate-type = ["cdylib", "rlib"]

[dependencies]
ephpm-middleware.workspace = true
ephpm-middleware-modules.workspace = true

[dev-dependencies]
# The fail-open integration test needs its own process (the host KV store is
# process-global and can only be set once) and drives `MaintenanceMode`
# directly with NO store wired in.
ephpm-middleware = { workspace = true, features = ["host"] }
serde_json.workspace = true

[lints]
workspace = true
