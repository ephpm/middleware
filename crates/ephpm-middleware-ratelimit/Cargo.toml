[package]
name = "ephpm-middleware-ratelimit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Example ePHPm native middleware: fixed-window per-client rate limiting over the embedded KV store"

[lib]
# cdylib = the loadable module ePHPm dlopen()s; rlib so the unit tests and the
# fail-open integration test can link the crate as a library.
crate-type = ["cdylib", "rlib"]

[dependencies]
ephpm-middleware.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `host` gives the tests RequestCtx / host_table and the real embedded KV
# store. The fail-open integration test (tests/fail_open.rs) runs in its own
# process because the host KV store is process-global and set-once. Dev-only.
ephpm-middleware = { workspace = true, features = ["host"] }
ephpm-kv.workspace = true

[lints]
workspace = true
