[package]
name = "ephpm-middleware-api-key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Example ePHPm native middleware: API-key auth gate that forwards the resolved consumer identity to PHP"

[lib]
# cdylib = the loadable module ePHPm dlopen()s; rlib so the unit tests can link
# the crate as a library.
crate-type = ["cdylib", "rlib"]

[dependencies]
ephpm-middleware.workspace = true
serde_json.workspace = true
# Constant-time key comparison — closes the timing oracle a naive `==` opens.
subtle.workspace = true

[dev-dependencies]
# `host` gives the tests RequestCtx / host_table to fabricate a request; the
# real embedded KV store backs the kv-lookup tests. Dev-only: resolver 3 keeps
# both out of the shipped cdylib, which needs neither.
ephpm-middleware = { workspace = true, features = ["host"] }
ephpm-kv.workspace = true

[lints]
workspace = true
