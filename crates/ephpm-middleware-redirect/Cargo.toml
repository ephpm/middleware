[package]
name = "ephpm-middleware-redirect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Example ePHPm native middleware: canonical-host / scheme / trailing-slash 301-308 redirects"

[lib]
# cdylib = the loadable module ePHPm dlopen()s; rlib so the unit tests can link
# the crate as a library.
crate-type = ["cdylib", "rlib"]

[dependencies]
ephpm-middleware.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `host` gives the tests RequestCtx / host_table to fabricate a request.
ephpm-middleware = { workspace = true, features = ["host"] }

[lints]
workspace = true
