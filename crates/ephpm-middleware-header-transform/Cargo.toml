[package]
name = "ephpm-middleware-header-transform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Example ePHPm native middleware: set request headers seen by PHP and set/remove response headers out (request + response phase)"

[lib]
# cdylib = the loadable module ePHPm dlopen()s; rlib so the unit tests can link
# the crate as a library.
crate-type = ["cdylib", "rlib"]

[dependencies]
ephpm-middleware.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `host` gives the tests RequestCtx / ResponseCtx / host_table to fabricate a
# request and response view. Dev-only.
ephpm-middleware = { workspace = true, features = ["host"] }

[lints]
workspace = true
