[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88 matches the ePHPm workspace and the `ephpm-middleware` ABI crate these
# examples depend on by git rev; cargo refuses to compile a dependency whose
# declared rust-version exceeds the active toolchain.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ephpm/middleware-examples"

[workspace.dependencies]
# The ePHPm native-middleware ABI + authoring kit. It lives in the ePHPm repo
# (`crates/ephpm-middleware`) and is the shared contract between the host and
# every module. It is pinned by `rev` exactly the way ePHPm pins litewire: a
# drift in `EphpmHostV1` / `ABI_V1` would be silent UB at the FFI boundary, so
# each example is provably built against one specific host-ABI commit. To
# rebuild these examples against a newer host, replace `rev` and run
# `cargo update`.
#
# Pinned at ePHPm `c2774ab61b9d25b835282b2f70281fb45e11334d` — the commit
# tagged **v0.8.9**, the first published release carrying ephpm#448 (merged to
# main as `691e6fefa702e8f2a695af85377164866eedfbc5`), which took the ABI to
# **minor 3**. The rev is the released tag's commit rather than the tag name so
# the pin is immutable, and rather than the raw merge commit so these examples
# are provably built against an ABI that actually shipped in a host binary
# operators can run. Two things these examples care about landed there
# (ephpm#449 tracks this bump):
#
#   * `Request::vhost_id()` returns `Option<&str>`: the router's CANONICAL SITE
#     KEY, and `None` for a host that matched no virtual host — where it used to
#     return the raw `Host` header and could never be absent. It is a tenant
#     identity now, so a gate can fail closed on `None` instead of keying policy
#     on a client-supplied string (ephpm#390).
#   * The host table's `kv_*` callbacks resolve THE SERVING VHOST'S keyspace
#     rather than the process-global store (ephpm#376). The appended
#     `kv_*_global` slots reach the process-wide store, which is where
#     operator-owned state — such as `api-key`'s credential map — has to live on
#     a multi-tenant node, because no tenant's PHP can write there.
#
# The previous pin was `e63284838d07d348e2155e76916daaf9782c012b` (#408, the
# response-phase hook the header-transform example builds on); everything from
# that rev is still present, since ABI growth is additive within major 1.
ephpm-middleware = { git = "https://github.com/ephpm/ephpm.git", rev = "c2774ab61b9d25b835282b2f70281fb45e11334d" }
# Test-only: the same embedded KV store the host wires into the middleware host
# table, so the api-key and ratelimit examples exercise the real KV path in
# their unit tests. Same rev as the ABI crate so both resolve to one crate
# instance and the `Store` type matches `ephpm_middleware::host::set_kv_store`.
ephpm-kv = { git = "https://github.com/ephpm/ephpm.git", rev = "c2774ab61b9d25b835282b2f70281fb45e11334d" }

# Every example parses its config out of a `serde_json::Value`.
serde_json = "1"
# api-key + basic-auth: constant-time credential comparison to close the timing
# oracle a naive `==` would open. Tiny, no_std, no transitive deps.
subtle = "2"
# basic-auth: standard-alphabet base64 to decode the RFC 7617 `Authorization:
# Basic` credential. Tiny, no_std, audited — the same crate the ePHPm middleware
# workspace uses for its token codecs.
base64ct = { version = "1", features = ["alloc"] }

# Release-profile tuning. `panic = "abort"` is DELIBERATELY NOT set: the
# `declare!` glue in `ephpm-middleware` uses `catch_unwind` to fail CLOSED on a
# panicking `invoke` (return 500) and fail STARTUP on a panicking `init`. Under
# `panic = "abort"` those become no-ops and any module panic kills the whole
# host process. Keep unwinding.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Mirror the ePHPm workspace's allow-list so a module that passes clippy here
# passes it there too.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
items_after_statements = "allow"
manual_clamp = "allow"
manual_let_else = "allow"
needless_pass_by_value = "allow"
ref_option = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
unchecked_time_subtraction = "allow"
ignore_without_reason = "allow"
uninlined_format_args = "allow"
unnecessary_cast = "allow"
unused_async = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
